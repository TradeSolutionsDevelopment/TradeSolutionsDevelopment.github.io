<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>DOOM·COMMANDO·FPS·WASD·OCCLUSION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: #0a1a1f; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', Courier, monospace; touch-action: pan-y; }
        .arcade-cabinet { background: linear-gradient(145deg, #1c3840, #152a30); padding: 15px 15px 20px; border-radius: 30px 30px 15px 15px; box-shadow: 0 15px 0 #0c1c22, 0 20px 30px rgba(0,0,0,0.8); border-bottom: 8px solid #2d5662; max-width: 1000px; width: 100%; margin: auto; display: flex; flex-direction: column; }
        canvas { display: block; margin: 0 auto; border: 6px solid #2e5665; border-radius: 16px; box-shadow: inset 0 0 0 4px #6d9eb0, 0 8px 0 #142f39; width: 100%; height: auto; aspect-ratio: 800 / 500; image-rendering: crisp-edges; image-rendering: pixelated; background: #10262e; }
        .panel { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: #b9f3ff; text-shadow: 2px 2px 0 #0f2a30; background: linear-gradient(145deg, #1f424b, #17323a); padding: 8px 16px; border-radius: 40px; border-bottom: 6px solid #0e262c; font-size: clamp(14px,4vw,20px); font-weight: 900; letter-spacing: 2px; flex-wrap: wrap; }
        .scores, .health { display: flex; align-items: center; gap: 5px; background: #10262e; padding: 4px 12px; border-radius: 30px; border-bottom: 4px solid #308595; color: #fdffb8; }
        .btn { background: #cf4e5c; color: white; border: none; border-radius: 40px; padding: 8px 18px; font-size: clamp(16px,4vw,22px); font-weight: bold; border-bottom: 6px solid #822c36; cursor: pointer; transition: 0.06s; font-family: 'Courier New', monospace; text-shadow: 2px 2px 0 #4e1e24; letter-spacing: 2px; }
        .btn:active { background: #ec6a7a; border-bottom-width: 3px; transform: translateY(3px); }
        .legend { color: #b3ecff; font-size: 15px; display: flex; gap: 20px; background: #16353f; padding: 8px 16px; border-radius: 40px; border-bottom: 5px solid #0b1f24; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        .touch-controls { display: none; margin-top: 15px; flex-direction: column; gap: 10px; background: #2b4b55; border-radius: 40px; border-bottom: 8px solid #16333a; padding: 15px 10px; touch-action: none; }
        .touch-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .joystick { width: 140px; height: 140px; background: #1f3a40; border-radius: 50%; border-bottom: 8px solid #0f262c; display: flex; justify-content: center; align-items: center; position: relative; touch-action: none; box-shadow: inset 0 0 10px #0a1a1f; }
        .joystick-base { width: 100px; height: 100px; background: radial-gradient(circle at 30% 30%, #3f5f68, #1f3a40); border-radius: 50%; border-bottom: 6px solid #1a2f35; display: flex; justify-content: center; align-items: center; position: relative; }
        .joystick-handle { width: 60px; height: 60px; background: radial-gradient(circle at 30% 30%, #7fa3ac, #4f6f78); border-radius: 50%; border-bottom: 6px solid #3a555e; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 -2px 0 #3a555e, 0 0 10px #a0d0d0; transition: 0.02s; position: relative; left: 0; top: 0; touch-action: none; }
        .ab-buttons { display: flex; gap: 15px; margin-right: 10px; }
        .ab { background: radial-gradient(circle at 30% 30%, #b35a6a, #9e4a5c); width: 80px; height: 80px; border-radius: 50%; border-bottom: 8px solid #632c38; display: flex; justify-content: center; align-items: center; font-size: 28px; color: white; text-shadow: 3px 3px 0 #3a1e24; box-shadow: inset 0 -4px 0 #753a46, 0 0 15px #ff8c8c; cursor: pointer; touch-action: none; }
        .ab:active { border-bottom-width: 3px; transform: translateY(5px); background: radial-gradient(circle at 30% 30%, #d06a7a, #b35a6a); }
        .mobile-info { display: none; color: #b3ecff; background: #16353f; padding: 8px 16px; border-radius: 40px; border-bottom: 5px solid #0b1f24; font-size: 15px; justify-content: space-around; align-items: center; width: 100%; }
        .mobile-info span { background: #0c2a30; padding: 4px 12px; border-radius: 20px; }
        @media (max-width:900px) { 
            .touch-controls { display: flex !important; } 
            .legend { display: none; } 
            .mobile-info { display: flex !important; } 
            .joystick { width: 120px; height: 120px; } 
            .joystick-base { width: 90px; height: 90px; } 
            .joystick-handle { width: 55px; height: 55px; } 
            .ab { width: 70px; height: 70px; font-size: 26px; } 
        }
    </style>
</head>
<body>
<div class="arcade-cabinet" id="gameCabinet">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div class="panel">
        <div class="scores">🎯 <span id="scoreDisplay">00000</span></div>
        <div class="scores">🏆 <span id="highScoreDisplay">00000</span></div>
        <div class="health">❤️ <span id="healthDisplay">████████</span></div>
        <button class="btn" id="restartButton">↻ RESTART</button>
    </div>
    
    <div class="legend">
        <span><i>WASD</i> MOVE / STRAFE</span>
        <span><i>MOUSE</i> LOOK (CLICK TO LOCK)</span>
        <span><i>LEFT CLICK / SPACE</i> HOLD TO SHOOT</span>
        <span><i>RIGHT CLICK / SHIFT</i> BOMB</span>
        <span><i>P</i> PAUSE</span>
        <span id="levelDisplayDesktop">LVL 1 · JUNGLE</span>
    </div>
    <div class="touch-controls" id="touchControls">
        <div class="touch-row">
            <div class="joystick" id="joystickContainer">
                <div class="joystick-base" id="joystickBase">
                    <div class="joystick-handle" id="joystickHandle"></div>
                </div>
            </div>
            <div class="ab-buttons">
                <div class="ab" id="touchFire">🔥</div>
                <div class="ab" id="touchBomb">💣</div>
            </div>
        </div>
        <div class="mobile-info">
            <span id="mobileLevelDisplay">LVL 1 · JUNGLE</span>
            <span>🎮 MOVE / DRAG RIGHT TO LOOK</span>
            <span>💣 BOMB</span>
        </div>
    </div>
</div>
<script>
    (function(){
        'use strict';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // ----------  FPS RAYCASTER ENGINE ----------
        const CELL_SIZE = 64;          // world unit
        const PLAYER_RADIUS = 16;
        const FOV = Math.PI / 3;      // 60 degrees
        const HALF_FOV = FOV / 2;
        const NUM_RAYS = 240;         // Good resolution
        const PROJECTION_PLANE = (canvas.width / 2) / Math.tan(HALF_FOV);
        const MAX_RENDER_DIST = 1600; 
        const TURN_SPEED = 0.05;      
        const MOVE_SPEED = 4.0;       

        // ----------  GLOBALS ----------
        let worldMap = [];            
        let mapWidth = 32, mapHeight = 32;
        let enemies = [];
        let pickups = [];
        let bullets = [];            
        let particles = [];
        let level = 1, MAX_LEVEL = 6;
        let gameActive = true, gameOver = false, victoryFlag = false;
        let score = 0, highScore = 0;
        try { highScore = localStorage.getItem('commandoFPS') ? parseInt(localStorage.getItem('commandoFPS')) : 0; } catch(e) {}
        let playerHealth = 8, MAX_HEALTH = 8;
        let player = {
            x: 300, y: 300,          
            dir: 0,                  
            vx: 0, vy: 0,
            invincible: 0,
            bombCooldown: 0,
            shootTimer: 0,
            weapon: 'pistol'         
        };
        let exitDoor = { x: 0, y: 0, active: false };

        // ----------  POWER-UPS ----------
        let rapidFire = false, rapidTimer = 0;
        let shieldActive = false, shieldTimer = 0;
        let invincibleStar = false, starTimer = 0;
        let damageBoost = false, damageTimer = 0;
        let bombCharge = false, bombChargeTimer = 0;
        let regen = false, regenTimer = 0, regenCounter = 0;

        // ----------  LEVEL THEMES ----------
        let levelTheme = "jungle";
        let levelName = "SUNKEN JUNGLE";

        // ----------  CONTROLS (WASD only, no arrow keys) ----------
        const keys = { left: false, right: false, up: false, down: false, fire: false, bomb: false, turnLeft: false, turnRight: false };
        let mouseLook = 0;
        let touchLook = 0;
        let lastTouchX = 0;

        // ----------  BUILD 6 UNIQUE LEVELS ----------
        function buildLevel(lvl) {
            worldMap = Array(mapHeight).fill().map(() => Array(mapWidth).fill(0));
            enemies = [];
            pickups = [];
            exitDoor = { x: 0, y: 0, active: true };

            // border walls
            for (let x = 0; x < mapWidth; x++) {
                worldMap[0][x] = 1;
                worldMap[mapHeight-1][x] = 1;
            }
            for (let y = 0; y < mapHeight; y++) {
                worldMap[y][0] = 1;
                worldMap[y][mapWidth-1] = 1;
            }

            if (lvl === 1) { // JUNGLE 
                levelTheme = "jungle"; levelName = "SUNKEN JUNGLE";
                addRoom(2,2,8,8);
                addRoom(12,12,10,10);
                addRoom(22,2,8,8);
                for (let i=5; i<15; i++) worldMap[5][i] = 0; 
                for (let i=5; i<15; i++) worldMap[6][i] = 0;
                worldMap[8][8] = 1; worldMap[8][9] = 1; worldMap[9][8] = 1; worldMap[9][9] = 1;
                placeEnemies(5,5, 6);
                placeEnemies(15,15, 6);
                placeExit(28,28);
                player.x = 150; player.y = 150; player.dir = 0.5;
            } else if (lvl === 2) { // FACTORY 
                levelTheme = "factory"; levelName = "MACHINE COMPLEX";
                addRoom(4,4,12,12);
                addRoom(18,18,10,10);
                for (let i=8; i<24; i+=4) { worldMap[10][i] = 1; worldMap[10][i+1] = 1; }
                for (let i=6; i<16; i++) worldMap[i][12] = 1;
                placeEnemies(8,8, 8);
                placeEnemies(20,20, 4);
                placeExit(28,4);
                player.x = 200; player.y = 200; player.dir = 1.2;
            } else if (lvl === 3) { // ALIEN 
                levelTheme = "alien"; levelName = "ALIEN NEXUS";
                addRoom(3,3,15,15);
                addRoom(20,20,8,8);
                for (let i=5; i<10; i++) { worldMap[i][10] = 1; worldMap[i][11] = 1; }
                for (let i=15; i<25; i++) worldMap[15][i] = 1;
                worldMap[10][15] = 1; worldMap[11][15] = 1; worldMap[10][16] = 1;
                placeEnemies(6,6, 8);
                placeEnemies(22,22, 6);
                placeExit(4,28);
                player.x = 180; player.y = 180; player.dir = 2.0;
            } else if (lvl === 4) { // ICE 
                levelTheme = "ice"; levelName = "GLACIAL PEAK";
                addMaze(4,4,24,24); 
                for (let i=6; i<26; i+=4) for (let j=6; j<26; j+=4) worldMap[j][i] = 1;
                placeEnemies(10,10, 10);
                placeEnemies(20,20, 6);
                placeExit(28,28);
                player.x = 200; player.y = 200; player.dir = 3.0;
            } else if (lvl === 5) { // VOLCANO 
                levelTheme = "volcano"; levelName = "MOLTEN CORE";
                addRoom(5,5,20,20);
                for (let i=10; i<20; i++) { worldMap[10][i] = 1; worldMap[20][i] = 1; }
                for (let i=10; i<20; i++) { worldMap[i][10] = 1; worldMap[i][20] = 1; }
                placeEnemies(15,15, 10);
                placeEnemies(7,7, 6);
                placeExit(28,28);
                player.x = 220; player.y = 220; player.dir = 4.1;
            } else if (lvl === 6) { // FORTRESS 
                levelTheme = "fortress"; levelName = "FINAL FORTRESS";
                addRoom(3,3,26,26);
                for (let i=0; i<10; i++) { worldMap[10+i][10] = 1; worldMap[10][10+i] = 1; }
                for (let i=0; i<10; i++) { worldMap[15+i][20] = 1; worldMap[20][15+i] = 1; }
                placeEnemies(15,15, 12);
                placeEnemies(25,25, 8);
                placeExit(28,28);
                player.x = 200; player.y = 200; player.dir = 2.8;
            }
        }

        function addRoom(x,y,w,h) {
            for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) worldMap[y+j][x+i] = (i===0 || i===w-1 || j===0 || j===h-1) ? 1 : 0;
        }

        function addMaze(x,y,w,h) {
            for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) worldMap[y+j][x+i] = 1;
            for (let i = 1; i < w-1; i++) for (let j = 1; j < h-1; j++) worldMap[y+j][x+i] = Math.random() > 0.3 ? 1 : 0;
            for (let i = 1; i < w-1; i+=2) for (let j = 1; j < h-1; j+=2) worldMap[y+j][x+i] = 0;
        }

        function placeEnemies(cx, cy, count) {
            for (let i=0; i<count; i++) {
                let angle = (i/count)*Math.PI*2 + Math.random()*0.5;
                let dist = 4 + Math.random()*4;
                let x = cx + Math.cos(angle)*dist;
                let y = cy + Math.sin(angle)*dist;
                enemies.push({
                    x: x*CELL_SIZE + CELL_SIZE/2, y: y*CELL_SIZE + CELL_SIZE/2,
                    health: 3 + Math.floor(Math.random()*4) + level,
                    type: Math.random()>0.6 ? 'soldier' : 'heavy',
                    state: 'idle', timer: Math.random()*10,
                    sprite: 0
                });
            }
        }

        function placeExit(x,y) {
            exitDoor = { x: x*CELL_SIZE + CELL_SIZE/2, y: y*CELL_SIZE + CELL_SIZE/2, active: true };
        }

        // ----------  RESET GAME ----------
        function resetGame() {
            gameActive = true; gameOver = false; victoryFlag = false;
            playerHealth = MAX_HEALTH = 8;
            score = 0;
            rapidFire=false; rapidTimer=0; shieldActive=false; shieldTimer=0; invincibleStar=false; starTimer=0;
            damageBoost=false; damageTimer=0; bombCharge=false; bombChargeTimer=0; regen=false; regenTimer=0; regenCounter=0;
            player.invincible = 0; player.bombCooldown = 0; player.weapon = 'pistol';
            buildLevel(level);
            updateUI();
        }

        // ----------  OCCLUSION CHECK (improved robustness) ----------
        function isOccluded(sx, sy) {
            let dx = sx - player.x;
            let dy = sy - player.y;
            let dist = Math.hypot(dx, dy);
            if (dist < 20) return false; // too close, never occluded

            let angle = Math.atan2(dy, dx);
            let rayDirX = Math.cos(angle);
            let rayDirY = Math.sin(angle);

            let posX = player.x / CELL_SIZE;
            let posY = player.y / CELL_SIZE;
            let mapX = Math.floor(posX);
            let mapY = Math.floor(posY);

            // Handle near-zero directions to avoid Infinity/NaN
            let deltaDistX = (Math.abs(rayDirX) < 1e-6) ? 1e30 : Math.abs(1 / rayDirX);
            let deltaDistY = (Math.abs(rayDirY) < 1e-6) ? 1e30 : Math.abs(1 / rayDirY);

            let stepX, stepY, sideDistX, sideDistY;

            if (rayDirX < 0) {
                stepX = -1;
                sideDistX = (posX - mapX) * deltaDistX;
            } else {
                stepX = 1;
                sideDistX = (mapX + 1 - posX) * deltaDistX;
            }
            if (rayDirY < 0) {
                stepY = -1;
                sideDistY = (posY - mapY) * deltaDistY;
            } else {
                stepY = 1;
                sideDistY = (mapY + 1 - posY) * deltaDistY;
            }

            let hit = false;
            let perpDist = 0;
            let side;
            let stepCount = 0;

            while (!hit && stepCount < 100) {
                stepCount++;
                if (sideDistX < sideDistY) {
                    sideDistX += deltaDistX;
                    mapX += stepX;
                    side = 0;
                } else {
                    sideDistY += deltaDistY;
                    mapY += stepY;
                    side = 1;
                }
                if (mapX < 0 || mapY < 0 || mapX >= mapWidth || mapY >= mapHeight) break;
                if (worldMap[mapY] && worldMap[mapY][mapX] === 1) hit = true;
            }

            if (hit) {
                if (side === 0) perpDist = (mapX - posX + (1 - stepX) / 2) / rayDirX;
                else perpDist = (mapY - posY + (1 - stepY) / 2) / rayDirY;
                let hitDist = perpDist * CELL_SIZE;
                // small epsilon to avoid self-occlusion
                return hitDist < dist - 8;
            }
            return false;
        }

        // ----------  RAYCAST RENDERER ----------
        function renderFrame() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // FLOOR / CEILING 
            let floorGrad = ctx.createLinearGradient(0, canvas.height/2, 0, canvas.height);
            floorGrad.addColorStop(0, levelTheme === 'jungle' ? '#1a4a3a' : levelTheme==='factory'?'#3a4a4a':levelTheme==='alien'?'#2a2a5a':levelTheme==='ice'?'#a0d0e0':levelTheme==='volcano'?'#4a2a2a':'#2a2a3a');
            floorGrad.addColorStop(1, '#102020');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, canvas.height/2, canvas.width, canvas.height/2);

            let ceilGrad = ctx.createLinearGradient(0, 0, 0, canvas.height/2);
            ceilGrad.addColorStop(0, '#203040');
            ceilGrad.addColorStop(1, levelTheme === 'jungle' ? '#3a6a4a' : levelTheme==='factory'?'#5a6a6a':levelTheme==='alien'?'#4a4a8a':levelTheme==='ice'?'#c0e0f0':levelTheme==='volcano'?'#6a3a3a':'#3a3a4a');
            ctx.fillStyle = ceilGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height/2);

            let rayAngle = player.dir - HALF_FOV;
            let angleStep = FOV / NUM_RAYS;

            for (let ray = 0; ray < NUM_RAYS; ray++) {
                let angle = rayAngle + ray * angleStep;
                let rayDirX = Math.cos(angle);
                let rayDirY = Math.sin(angle);

                let posX = player.x / CELL_SIZE;
                let posY = player.y / CELL_SIZE;
                let mapX = Math.floor(posX);
                let mapY = Math.floor(posY);

                let deltaDistX = (Math.abs(rayDirX) < 1e-6) ? 1e30 : Math.abs(1 / rayDirX);
                let deltaDistY = (Math.abs(rayDirY) < 1e-6) ? 1e30 : Math.abs(1 / rayDirY);

                let stepX, stepY, sideDistX, sideDistY;

                if (rayDirX < 0) {
                    stepX = -1;
                    sideDistX = (posX - mapX) * deltaDistX;
                } else {
                    stepX = 1;
                    sideDistX = (mapX + 1.0 - posX) * deltaDistX;
                }
                if (rayDirY < 0) {
                    stepY = -1;
                    sideDistY = (posY - mapY) * deltaDistY;
                } else {
                    stepY = 1;
                    sideDistY = (mapY + 1.0 - posY) * deltaDistY;
                }

                let hit = false;
                let side;
                let stepCount = 0;

                while (!hit && stepCount < 100) {
                    stepCount++;
                    if (sideDistX < sideDistY) {
                        sideDistX += deltaDistX;
                        mapX += stepX;
                        side = 0;
                    } else {
                        sideDistY += deltaDistY;
                        mapY += stepY;
                        side = 1;
                    }
                    if (mapX < 0 || mapY < 0 || mapX >= mapWidth || mapY >= mapHeight) break;
                    if (worldMap[mapY] && worldMap[mapY][mapX] === 1) hit = true;
                }

                if (hit) {
                    let perpDist;
                    if (side === 0) perpDist = (mapX - posX + (1 - stepX) / 2) / rayDirX;
                    else perpDist = (mapY - posY + (1 - stepY) / 2) / rayDirY;

                    let dist = perpDist * CELL_SIZE;
                    let height = (CELL_SIZE / dist) * PROJECTION_PLANE;
                    let wallTop = (canvas.height / 2) - height / 2;
                    let wallBottom = (canvas.height / 2) + height / 2;

                    let texX;
                    if (side === 0) texX = posY + perpDist * rayDirY;
                    else texX = posX + perpDist * rayDirX;
                    texX -= Math.floor(texX);
                    let texPixel = texX * CELL_SIZE;

                    let shade = Math.min(255, Math.max(80, 255 - (dist / 5)));
                    if (side === 1) shade *= 0.7; 

                    let pattern = Math.floor(texPixel) % 8 < 4 ? shade - 30 : shade;
                    let r, g, b;
                    if (levelTheme === 'jungle') { r = pattern - 100; g = pattern - 20; b = pattern - 150; }
                    else if (levelTheme === 'factory') { r = g = b = pattern - 50; }
                    else if (levelTheme === 'alien') { r = pattern - 150; g = pattern - 100; b = pattern; }
                    else if (levelTheme === 'ice') { r = g = pattern; b = 255; }
                    else if (levelTheme === 'volcano') { r = pattern; g = b = pattern - 100; }
                    else { r = g = pattern - 50; b = pattern; }

                    ctx.fillStyle = `rgb(${Math.max(0,r)},${Math.max(0,g)},${Math.max(0,b)})`;
                    ctx.fillRect(ray * (canvas.width / NUM_RAYS), wallTop, (canvas.width / NUM_RAYS) + 1, wallBottom - wallTop);
                }
            }

            // ----- SPRITES (enemies, pickups, exit, particles) -----
            let sprites = [];
            enemies.forEach(e => sprites.push({ type: 'enemy', x: e.x, y: e.y, health: e.health, enemyType: e.type, sprite: e.sprite }));
            pickups.forEach(p => sprites.push({ type: 'pickup', x: p.x, y: p.y, pickupType: p.type }));
            particles.forEach(p => sprites.push({ type: 'particle', x: p.x, y: p.y, color: p.color, size: p.size }));
            if (exitDoor.active && enemies.length === 0) sprites.push({ type: 'exit', x: exitDoor.x, y: exitDoor.y });

            sprites.sort((a,b) => (Math.hypot(b.x - player.x, b.y - player.y) - Math.hypot(a.x - player.x, a.y - player.y)));

            sprites.forEach(s => {
                let dx = s.x - player.x, dy = s.y - player.y;
                let dist = Math.hypot(dx, dy);
                if (dist > MAX_RENDER_DIST || dist < 1) return;
                let angleToSprite = Math.atan2(dy, dx) - player.dir;
                angleToSprite = (angleToSprite + Math.PI) % (2 * Math.PI) - Math.PI;
                if (Math.abs(angleToSprite) > HALF_FOV + 0.3) return;

                // OCCLUSION CHECK: skip if hidden behind wall
                if (isOccluded(s.x, s.y)) return;

                let spriteSize = (CELL_SIZE / dist) * PROJECTION_PLANE;
                let xPos = canvas.width / 2 + (angleToSprite / FOV) * canvas.width - spriteSize / 2;
                let yPos = canvas.height / 2 - spriteSize / 2;

                let shade = Math.max(0.5, 1 - dist / MAX_RENDER_DIST);

                if (s.type === 'enemy') {
                    let color = s.enemyType === 'soldier' ? `rgba(100,200,100,${shade})` : `rgba(200,100,100,${shade})`;
                    ctx.fillStyle = color;
                    ctx.fillRect(xPos + spriteSize * 0.2, yPos + spriteSize * 0.4, spriteSize * 0.6, spriteSize * 0.6);
                    ctx.fillRect(xPos + spriteSize * 0.3, yPos + spriteSize * 0.1, spriteSize * 0.4, spriteSize * 0.3);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(xPos + spriteSize * 0.35, yPos + spriteSize * 0.2, spriteSize * 0.1, spriteSize * 0.1);
                    ctx.fillRect(xPos + spriteSize * 0.55, yPos + spriteSize * 0.2, spriteSize * 0.1, spriteSize * 0.1);
                } else if (s.type === 'pickup') {
                    let color;
                    switch (s.pickupType) {
                        case 'health': color = '#ff0000'; break;
                        case 'rapid': color = '#ffff00'; break;
                        case 'shield': color = '#00ffff'; break;
                        case 'star': color = '#ffaa00'; break;
                        case 'damage': color = '#ff00ff'; break;
                        case 'bomb': color = '#00ff00'; break;
                        case 'regen': color = '#ffffff'; break;
                        case 'shotgun': color = '#a0a0a0'; break;
                        default: color = '#ffd966';
                    }
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(xPos + spriteSize / 2, yPos + spriteSize / 2, spriteSize / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (s.type === 'exit') {
                    ctx.fillStyle = `rgba(255,217,102,${shade})`;
                    ctx.shadowBlur = 20; ctx.shadowColor = '#ffd966';
                    ctx.fillRect(xPos, yPos, spriteSize, spriteSize);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.moveTo(xPos + i * spriteSize / 5, yPos);
                        ctx.lineTo(xPos + i * spriteSize / 5, yPos + spriteSize);
                        ctx.stroke();
                    }
                } else if (s.type === 'particle') {
                    let pSize = (s.size / dist) * PROJECTION_PLANE;
                    ctx.fillStyle = s.color;
                    ctx.fillRect(xPos, yPos, pSize, pSize);
                }
            });

            // WEAPON
            let weaponColor = player.weapon === 'pistol' ? '#3a7251' : '#72513a';
            ctx.fillStyle = weaponColor;
            ctx.fillRect(canvas.width - 140, canvas.height - 90, 60, 40);
            ctx.fillRect(canvas.width - 120, canvas.height - 110, 30, 60);
            ctx.strokeStyle = '#ffffff80';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 15, canvas.height/2);
            ctx.lineTo(canvas.width/2 + 15, canvas.height/2);
            ctx.moveTo(canvas.width/2, canvas.height/2 - 15);
            ctx.lineTo(canvas.width/2, canvas.height/2 + 15);
            ctx.stroke();
        }

        // ----------  UPDATE WORLD ----------
        function updatePlayer() {
            if (!gameActive) return;
            if (playerHealth <= 0) { gameActive = false; gameOver = true; victoryFlag = false; return; }

            if (rapidTimer > 0) rapidTimer--; else rapidFire = false;
            if (shieldTimer > 0) shieldTimer--; else shieldActive = false;
            if (starTimer > 0) starTimer--; else invincibleStar = false;
            if (damageTimer > 0) damageTimer--; else damageBoost = false;
            if (bombChargeTimer > 0) bombChargeTimer--; else bombCharge = false;
            if (regenTimer > 0) { regenTimer--; regenCounter++; if (regenCounter > 40) { if (playerHealth < MAX_HEALTH) playerHealth++; regenCounter = 0; } } else regen = false;

            if (keys.turnLeft) player.dir -= TURN_SPEED;
            if (keys.turnRight) player.dir += TURN_SPEED;
            player.dir += mouseLook * 0.002;
            player.dir += touchLook * 0.003;
            mouseLook = 0;
            touchLook = 0;
            player.dir = (player.dir + 2 * Math.PI) % (2 * Math.PI);

            let moveX = 0, moveY = 0;
            if (keys.up) { moveX += Math.cos(player.dir) * MOVE_SPEED; moveY += Math.sin(player.dir) * MOVE_SPEED; }
            if (keys.down) { moveX -= Math.cos(player.dir) * MOVE_SPEED; moveY -= Math.sin(player.dir) * MOVE_SPEED; }
            if (keys.left) { moveX += Math.cos(player.dir - Math.PI/2) * MOVE_SPEED; moveY += Math.sin(player.dir - Math.PI/2) * MOVE_SPEED; }
            if (keys.right) { moveX += Math.cos(player.dir + Math.PI/2) * MOVE_SPEED; moveY += Math.sin(player.dir + Math.PI/2) * MOVE_SPEED; }

            let nx = player.x + moveX, ny = player.y + moveY;
            if (!collideWorld(nx, player.y)) player.x = nx;
            if (!collideWorld(player.x, ny)) player.y = ny;

            // SHOOTING
            if (keys.fire && player.shootTimer <= 0) {
                let fireDelay = rapidFire ? 4 : (player.weapon === 'shotgun' ? 20 : 12);
                let damage = damageBoost ? 2 : 1;
                let rays = player.weapon === 'shotgun' ? 5 : 1;
                let spread = player.weapon === 'shotgun' ? 0.15 : 0;

                for (let r = 0; r < rays; r++) {
                    let shotAngle = player.dir + (r - (rays - 1) / 2) * spread;
                    let hitEnemy = false;
                    let closestDist = Infinity;
                    let hitIndex = -1;

                    for (let i = 0; i < enemies.length; i++) {
                        let e = enemies[i];
                        let dx = e.x - player.x, dy = e.y - player.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist > 400 || dist >= closestDist) continue;
                        let angleToEnemy = Math.atan2(dy, dx);
                        let diff = angleToEnemy - shotAngle;
                        diff = (diff + Math.PI) % (2 * Math.PI) - Math.PI;
                        if (Math.abs(diff) < 0.15) {
                            hitEnemy = true;
                            closestDist = dist;
                            hitIndex = i;
                        }
                    }

                    if (hitEnemy) {
                        let e = enemies[hitIndex];
                        e.health -= damage * (player.weapon === 'shotgun' ? 1.5 : 1);
                        addParticles(e.x, e.y, '#ff0000', 12);
                        if (e.health <= 0) {
                            score += 50 + level * 10;
                            if (score > highScore) { highScore = score; localStorage.setItem('commandoFPS', highScore); }
                            addParticles(e.x, e.y, '#ff6600', 30);
                            enemies.splice(hitIndex, 1);
                            if (Math.random() < 0.8) {
                                let types = ['health','rapid','shield','star','damage','bomb','regen'];
                                if (Math.random() < 0.2) types.push('shotgun');
                                let type = types[Math.floor(Math.random() * types.length)];
                                pickups.push({ x: e.x, y: e.y, type: type, life: 600 });
                            }
                        }
                    } else {
                        let missX = player.x + Math.cos(shotAngle) * 400;
                        let missY = player.y + Math.sin(shotAngle) * 400;
                        addParticles(missX, missY, '#ffd966', 8);
                    }
                }
                player.shootTimer = fireDelay;
            }
            if (player.shootTimer > 0) player.shootTimer--;

            // BOMB
            if (keys.bomb && player.bombCooldown <= 0) {
                addParticles(player.x, player.y, '#ffaa00', 40);
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    if (Math.hypot(e.x - player.x, e.y - player.y) < 400) {
                        addParticles(e.x, e.y, '#ff6600', 40);
                        score += 50; if (score > highScore) { highScore = score; localStorage.setItem('commandoFPS', highScore); }
                        enemies.splice(i, 1);
                    }
                }
                player.bombCooldown = bombCharge ? 120 : 400;
            }
            if (player.bombCooldown > 0) player.bombCooldown--;

            if (player.invincible > 0) player.invincible--;
            if (invincibleStar) player.invincible = Math.max(player.invincible, 2);

            enemies.forEach(e => {
                e.timer++;
                e.sprite = Math.floor(e.timer / 8) % 2;
                let speed = e.type === 'soldier' ? 1.2 : 0.8;
                let dx = player.x - e.x, dy = player.y - e.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 20) {
                    e.x += (dx / dist) * speed;
                    e.y += (dy / dist) * speed;
                }
                if (!shieldActive && player.invincible <= 0 && !invincibleStar) {
                    if (dist < PLAYER_RADIUS + 25) {
                        playerHealth -= e.type === 'soldier' ? 1 : 2;
                        player.invincible = 60;
                        addParticles(player.x, player.y, '#ff5555', 15);
                    }
                }
            });

            for (let i = pickups.length - 1; i >= 0; i--) {
                let p = pickups[i];
                p.life--;
                if (p.life <= 0) { pickups.splice(i, 1); continue; }
                if (Math.hypot(player.x - p.x, player.y - p.y) < 35) {
                    switch (p.type) {
                        case 'health': playerHealth = Math.min(MAX_HEALTH, playerHealth + 3); break;
                        case 'rapid': rapidFire = true; rapidTimer = 800; break;
                        case 'shield': shieldActive = true; shieldTimer = 800; break;
                        case 'star': invincibleStar = true; starTimer = 600; break;
                        case 'damage': damageBoost = true; damageTimer = 800; break;
                        case 'bomb': bombCharge = true; bombChargeTimer = 800; player.bombCooldown = Math.max(0, player.bombCooldown - 200); break;
                        case 'regen': regen = true; regenTimer = 800; regenCounter = 0; break;
                        case 'shotgun': player.weapon = 'shotgun'; break;
                    }
                    pickups.splice(i, 1);
                }
            }

            if (exitDoor.active && enemies.length === 0 && Math.hypot(player.x - exitDoor.x, player.y - exitDoor.y) < 50) {
                if (level < MAX_LEVEL) { level++; buildLevel(level); updateUI(); }
                else { victoryFlag = true; gameActive = false; }
            }
        }

        function collideWorld(x, y) {
            let mx = Math.floor(x / CELL_SIZE), my = Math.floor(y / CELL_SIZE);
            if (mx < 0 || my < 0 || mx >= mapWidth || my >= mapHeight) return true;
            if (worldMap[my][mx] === 1) return true;
            for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
                let nx = mx + i, ny = my + j;
                if (nx < 0 || ny < 0 || nx >= mapWidth || ny >= mapHeight) continue;
                if (worldMap[ny][nx] === 1) {
                    let wx = nx * CELL_SIZE + CELL_SIZE / 2, wy = ny * CELL_SIZE + CELL_SIZE / 2;
                    if (Math.hypot(x - wx, y - wy) < PLAYER_RADIUS + CELL_SIZE / 2 - 10) return true;
                }
            }
            return false;
        }

        function addParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 30 + Math.random() * 30,
                    color,
                    size: 3 + Math.random() * 3
                });
            }
        }

        function updateEffects() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.95; p.vy *= 0.95;
                p.life -= 1;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = String(Math.floor(score)).padStart(5, '0');
            document.getElementById('highScoreDisplay').innerText = String(highScore).padStart(5, '0');
            let bar = '';
            for (let i = 0; i < MAX_HEALTH; i++) bar += (i < playerHealth) ? '█' : '░';
            document.getElementById('healthDisplay').innerText = bar;
            let txt = `LVL ${level} · ${levelName}`;
            document.getElementById('levelDisplayDesktop').innerText = txt;
            if (document.getElementById('mobileLevelDisplay')) document.getElementById('mobileLevelDisplay').innerText = txt;
        }

        // ----------  CONTROLS (WASD only, no arrow keys) ----------
        function initControls() {
            canvas.addEventListener('click', () => {
                if (gameActive && !document.pointerLockElement) canvas.requestPointerLock();
            });
            document.addEventListener('pointerlockchange', () => {});

            window.addEventListener('keydown', (e) => {
                let key = e.key.toLowerCase();
                if (key === 'w') keys.up = true;
                if (key === 's') keys.down = true;
                if (key === 'a') keys.left = true;
                if (key === 'd') keys.right = true;
                if (key === ' ') keys.fire = true;
                if (key === 'shift') keys.bomb = true;
                if (key === 'q') keys.turnLeft = true;
                if (key === 'e') keys.turnRight = true;
                if (key === 'p') gameActive = !gameActive;
                e.preventDefault();
            });
            window.addEventListener('keyup', (e) => {
                let key = e.key.toLowerCase();
                if (key === 'w') keys.up = false;
                if (key === 's') keys.down = false;
                if (key === 'a') keys.left = false;
                if (key === 'd') keys.right = false;
                if (key === ' ') keys.fire = false;
                if (key === 'shift') keys.bomb = false;
                if (key === 'q') keys.turnLeft = false;
                if (key === 'e') keys.turnRight = false;
                e.preventDefault();
            });

            canvas.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === canvas && gameActive) mouseLook = e.movementX;
            });
            canvas.addEventListener('mousedown', (e) => {
                if (gameActive) {
                    if (e.button === 0) keys.fire = true;
                    if (e.button === 2) keys.bomb = true;
                }
            });
            canvas.addEventListener('mouseup', (e) => {
                if (e.button === 0) keys.fire = false;
                if (e.button === 2) keys.bomb = false;
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                let touch = e.touches[0];
                if (touch.clientX > canvas.offsetLeft + canvas.width / 2) lastTouchX = touch.clientX;
            });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                let touch = e.touches[0];
                if (touch.clientX > canvas.offsetLeft + canvas.width / 2) {
                    touchLook = touch.clientX - lastTouchX;
                    lastTouchX = touch.clientX;
                }
            });
            canvas.addEventListener('touchend', (e) => { e.preventDefault(); touchLook = 0; });

            const stick = document.getElementById('joystickHandle');
            const base = document.getElementById('joystickBase');
            const container = document.getElementById('joystickContainer');
            if (stick && base && container) {
                let active = false;
                const maxDist = 40;
                function handleStart(e) { e.preventDefault(); active = true; }
                function handleMove(e) {
                    if (!active) return; e.preventDefault();
                    let touch = e.touches ? e.touches[0] : e;
                    let rect = base.getBoundingClientRect(), cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
                    let dx = touch.clientX - cx, dy = touch.clientY - cy, dist = Math.hypot(dx, dy);
                    if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
                    stick.style.left = dx + 'px'; stick.style.top = dy + 'px';
                    keys.up = dy < -10;
                    keys.down = dy > 10;
                    keys.left = dx < -10;
                    keys.right = dx > 10;
                }
                function handleEnd(e) { e.preventDefault(); active = false; stick.style.left='0px'; stick.style.top='0px'; keys.up=keys.down=keys.left=keys.right=false; }
                container.addEventListener('touchstart', handleStart, { passive: false });
                container.addEventListener('touchmove', handleMove, { passive: false });
                container.addEventListener('touchend', handleEnd);
                container.addEventListener('touchcancel', handleEnd);
            }

            const tf = document.getElementById('touchFire');
            const tb = document.getElementById('touchBomb');
            if (tf) {
                tf.addEventListener('touchstart', (e)=>{ e.preventDefault(); keys.fire=true; });
                tf.addEventListener('touchend', (e)=>{ e.preventDefault(); keys.fire=false; });
            }
            if (tb) {
                tb.addEventListener('touchstart', (e)=>{ e.preventDefault(); keys.bomb=true; });
                tb.addEventListener('touchend', (e)=>{ e.preventDefault(); keys.bomb=false; });
            }
        }

        function gameLoop() {
            updatePlayer();
            updateEffects();
            updateUI();
            renderFrame();
            if (!gameActive) {
                ctx.save();
                ctx.fillStyle = '#000000bb';
                ctx.fillRect(200, 180, 400, 120);
                ctx.fillStyle = '#ffe98c';
                ctx.font = '40px "Courier New", monospace';
                ctx.textAlign = 'center';
                if (victoryFlag) ctx.fillText('🏁 VICTORY!', 400, 250);
                else if (gameOver) ctx.fillText('❌ GAME OVER', 400, 250);
                else ctx.fillText('- PAUSED -', 400, 250);
                ctx.font = '20px "Courier New", monospace';
                ctx.fillText('Click Restart or Press P', 400, 280);
                ctx.restore();
            }
            requestAnimationFrame(gameLoop);
        }

        function init() {
            resetGame();
            initControls();
            document.getElementById('restartButton').addEventListener('click', resetGame);
            gameLoop();
        }

        window.addEventListener('load', init);
    })();
</script>
</body>
</html>
